<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <!-- Motivo de azulejo poblano: celosía de diamantes + flor de 4 pétalos al centro de cada uno.
       Se aplica como background-image repetible de app/globals.css (.mesh-gradient); la opacidad
       ya va incluida aquí para que el resultado final sea "moderado": visible, pero secundario
       al contenido, sobre todo una vez que el vidrio esmerilado lo atenúa más encima. -->
  <g fill="none" stroke="#2B5F8A" stroke-width="1" opacity="0.4">
    <path d="M70 0 L140 70 L70 140 L0 70 Z" />
    <circle cx="56" cy="70" r="14" />
    <circle cx="84" cy="70" r="14" />
    <circle cx="70" cy="56" r="14" />
    <circle cx="70" cy="84" r="14" />
  </g>
  <circle cx="70" cy="70" r="4" fill="#2B5F8A" opacity="0.35" />
</svg>
